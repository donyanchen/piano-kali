# Conservative voicing for the sheng stereo speaker UCM route.
# The six CS35L43 amplifiers retain their existing gains and Protection firmware.
# Install in ~/.config/pipewire/filter-chain.conf.d/ and restart filter-chain.service.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Sheng balanced speakers"
      media.name = "Sheng balanced speakers"
      filter.graph = {
        nodes = [
          { type = builtin name = headroom label = linear
            control = { "Mult" = 0.7079458 "Add" = 0.0 } }
          { type = builtin name = subsonic label = bq_highpass
            control = { "Freq" = 80.0 "Q" = 0.7071068 "Gain" = 0.0 } }
          { type = builtin name = boxiness label = bq_peaking
            control = { "Freq" = 250.0 "Q" = 0.85 "Gain" = -1.5 } }
          { type = builtin name = presence label = bq_peaking
            control = { "Freq" = 2800.0 "Q" = 0.8 "Gain" = 1.0 } }
          { type = builtin name = treble label = bq_highshelf
            control = { "Freq" = 8000.0 "Q" = 0.7071068 "Gain" = -1.0 } }
        ]
        links = [
          { output = "headroom:Out" input = "subsonic:In" }
          { output = "subsonic:Out" input = "boxiness:In" }
          { output = "boxiness:Out" input = "presence:In" }
          { output = "presence:Out" input = "treble:In" }
        ]
        inputs = [ "headroom:In" ]
        outputs = [ "treble:Out" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "sheng-speaker-balanced"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        filter.smart = true
        filter.smart.name = "sheng-balanced"
        filter.smart.target = {
          node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
        }
      }
      playback.props = {
        node.name = "sheng-speaker-balanced-output"
        audio.position = [ FL FR ]
        node.passive = true
        stream.dont-remix = true
      }
    }
  }
]
