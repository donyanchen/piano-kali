name: kernel
# Build the piano kernel from "everything we have", in one shot:
#
#   1. upstream linux v7.4-rc3                (latest mainline)
#   2. linux-sm8750-piano piano patches       (panel, touch, charge, audio, sensors,
#                                              DSP, DTS, and the piano framebuffer votes)
#   3. the reference project's config fragments merged in order (merge_config.sh)
#   4. the piano board DTB built from the patched tree
#
# Nothing is cloned locally and nothing is flashed here: the artifact layout is
# what scripts/build-kali.sh consumes through PIANO_KERNEL_DIR.
on:
  workflow_dispatch:
    inputs:
      kver:
        description: upstream tag the piano patches are rebased onto
        default: v7.4-rc3
        required: true
      piano_ref:
        description: piano patch source (tag/branch/commit of linux-sm8750-piano)
        default: 1c21cb9895d69c1c5e83ceae68952fedf522644a
        required: true
      fast_only:
        description: 'Image + dtb only, no modules'
        type: boolean
        default: false
  # Dispatched by hand only: each run is ~40 min on a free runner.
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KVER: ${{ github.event.inputs.kver || 'v7.4-rc3' }}
  PIANO_SRC: https://github.com/yzddmr6/linux-sm8750-piano.git
  PIANO_REF: ${{ github.event.inputs.piano_ref || '1c21cb9895d69c1c5e83ceae68952fedf522644a' }}
  # The commit the piano branch is based on: everything after it is "our" patch set.
  PIANO_BASE: 7475ea8b58616b33c04afb976cf0fbaad9dd63fb
  KBUILD: '-j$(nproc) LLVM=1'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            lz4 xz-utils zstd cpio kmod ccache python3 git clang lld llvm
          clang --version | head -1
          git --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-piano-${{ env.KVER }}-${{ env.PIANO_REF }}
          restore-keys: |
            ccache-piano-${{ env.KVER }}-
            ccache-piano-

      # Fetch the piano tree first: it gives us the patch series, the config
      # fragments and the board DTS, all pinned by one reference.
      - name: Fetch the piano patch source
        run: |
          set -e
          # Fetch the branch, then check out the exact commit. Git servers do not
          # have to allow fetching an arbitrary commit by SHA, so asking for
          # "$PIANO_REF" directly works only by luck of the server config.
          git init -q piano
          cd piano
          git remote add origin "$PIANO_SRC"
          git fetch --depth 300 origin sm8750/v7.4-dev
          if ! git cat-file -e "$PIANO_REF^{commit}" 2>/dev/null; then
            git fetch --depth 300 origin "$PIANO_REF"
          fi
          git checkout -q "$PIANO_REF"
          test "$(git rev-parse HEAD)" = "$PIANO_REF" || {
            echo "::error::checked out $(git rev-parse HEAD), expected $PIANO_REF"
            exit 1
          }
          echo "piano tree at $(git rev-parse --short HEAD)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | head -3
          ls arch/arm64/configs/ | grep -E '^(piano|sm8750)'

      - name: Rebase the piano patches onto the new baseline
        run: |
          # One tree, three stages, all on the same history:
          #   1. make sure the piano tip is fully checked out
          #   2. fetch the target upstream tag from a GitHub mirror
          #      (git.kernel.org is unreachable from some runners - that is what
          #      killed the previous attempt with a 135 s connect timeout)
          #   3. rebase --onto the tag -> conflicts land in this step
          cd piano
          git checkout -q -- . 2>/dev/null || true
          echo "piano head: $(git rev-parse --short HEAD)"
          git checkout -q -B ci-replay
          # Refuse an unrelated piano tree: the pinned base must be an ancestor
          # and the tip must be the requested immutable commit.
          test "$(git rev-parse HEAD)" = "$PIANO_REF" || {
            echo "::error::unexpected piano source commit"
            exit 1
          }

          UPSTREAM_MIRROR=https://github.com/gregkh/linux.git
          if ! git rev-parse -q --verify "refs/tags/$KVER" >/dev/null; then
            git fetch -q --depth 1 "$UPSTREAM_MIRROR" "refs/tags/$KVER:refs/tags/$KVER" || {
              git fetch -q --depth 1 https://github.com/torvalds/linux.git \
                "refs/tags/$KVER:refs/tags/$KVER"
            }
          fi
          echo "target baseline: $(git rev-parse --short "refs/tags/$KVER") ($KVER)"

          # The merge base has to be reachable, otherwise git cannot replay the
          # piano commits. Widen the history only if it is not there yet.
          if ! git merge-base --is-ancestor "$PIANO_BASE" HEAD 2>/dev/null; then
            echo "== deepening history to reach $PIANO_BASE"
            for n in 600 1200 2400; do
              git fetch -q --deepen $n origin 2>/dev/null || true
              git merge-base --is-ancestor "$PIANO_BASE" HEAD 2>/dev/null && break
            done
          fi
          git merge-base --is-ancestor "$PIANO_BASE" HEAD || {
            echo "::error::cannot reach $PIANO_BASE in the fetched history"
            exit 1
          }
          echo "merge base: $(git merge-base "$PIANO_BASE" HEAD | cut -c1-12)"

          echo "== rebasing $(git rev-list --count "$PIANO_BASE"..HEAD) commits onto $KVER"
          # -X theirs: the only conflicts so far are add/add on tools/ (userspace
          # selftests that v7.4-rc3 also added this week). They never reach the
          # kernel image, so taking the patch side is harmless and keeps the
          # real driver commits applying.
          set -o pipefail
          if ! git -c user.name=ci -c user.email=ci@local \
               rebase -X theirs --onto "refs/tags/$KVER" "$PIANO_BASE" ci-replay 2>&1 | tail -40; then
            echo "::error::rebase stopped - see the conflicting files above"
            git status --short | head -40
            git rebase --abort || true
            exit 1
          fi
          # A rebase that silently produced nothing is a failure, not a success:
          # the old pipeline swallowed git's exit code through `tail`.
          N=$(git rev-list --count "refs/tags/$KVER"..HEAD)
          echo "== done: $N commits on $KVER"
          [ "$N" -gt 500 ] || {
            echo "::error::only $N commits landed on the new baseline"
            exit 1
          }

          # The charging stack is a whole subsystem ported in from the erhai
          # project (qcom_battmgr.c grew 1773 -> 4707 lines, plus erhai_*,
          # xiaomi_mca*, sc8541/sc96231/sc8547a). -X theirs merges that file
          # block by block and drops the pd_info/pdos_response definitions
          # while keeping the call sites, which fails to compile. Take the
          # piano version of the whole stack wholesale instead.
          CHG="drivers/power/supply"
          # NOTE: take these from the pristine piano commit, not from
          # ci-replay - ci-replay is the rebase result and -X theirs has
          # already merged that file block by block, so checking it out from
          # there only copies back the half-merged version.
          # Restore the charge files changed by the piano port, including nested
          # UFCS sources, but do not overwrite unrelated upstream charger files.
          # pmic_glink is the transport the MCA/CPS8601 drivers talk over, and
          # the piano port adds pmic_glink_client_neuter() to it and its header.
          # -X theirs reverts both to upstream, so restoring only the power/supply
          # directory leaves those callers with an undeclared function.
          CHG_FILES=$(git diff-tree --no-commit-id --name-only -r \
            "$PIANO_BASE" "$PIANO_REF" -- \
            "$CHG" drivers/soc/qcom/pmic_glink.c include/linux/soc/qcom/pmic_glink.h |
            grep -E '^drivers/power/supply/(Kconfig|Makefile|qcom_battmgr\.c|qcom_smb[bx]\.c|bq27xxx_battery(_test)?\.c|erhai_|xiaomi_mca|sc8541|sc8547|sc96231|cps8601|ufcs/)|^drivers/soc/qcom/pmic_glink\.c$|^include/linux/soc/qcom/pmic_glink\.h$')
          [ -n "$CHG_FILES" ] || {
            echo "::error::no charging stack files matched; refusing to continue"
            exit 1
          }
          echo "$CHG_FILES" | while IFS= read -r path; do
            git checkout "$PIANO_REF" -- "$path"
            echo "  piano: $path"
          done
          # Assert the transport symbol really survived, not just the files.
          grep -q 'void pmic_glink_client_neuter' drivers/soc/qcom/pmic_glink.c || {
            echo "::error::pmic_glink_client_neuter missing from pmic_glink.c"; exit 1; }
          grep -q 'pmic_glink_client_neuter' include/linux/soc/qcom/pmic_glink.h || {
            echo "::error::pmic_glink_client_neuter missing from its header"; exit 1; }
          echo "== charging stack taken from the piano tip"
          # Fail loudly if the preprocessed file still lost the definitions.
          for sym in qcom_battmgr_pd_info qcom_battmgr_pdos_response; do
            n=$(grep -c "static void $sym" "$CHG/qcom_battmgr.c" 2>/dev/null || true)
            n=${n:-0}
            echo "  $CHG/qcom_battmgr.c: $sym definitions = $n, lines = $(wc -l < "$CHG/qcom_battmgr.c")"
            [ "$n" -ge 1 ] || { echo "::error::$sym definition missing from the restored file"; exit 1; }
          done

      - name: Copy the rebased tree into place
        run: |
          # Keep the piano history (it is the modified tree) and just move it to
          # ./linux, which is where the build steps expect it.
          mv piano linux
          cd linux
          git log --oneline -1
          echo "-piano-${KVER#v}" > .scmversion

      - name: Merge the piano config fragments
        run: |
          cd linux
          make LLVM=1 defconfig
          FRAGS=()
          # Merge every fragment, in exactly kernel/source.json order. The old
          # list omitted netfilter, waydroid, snap and virt, so those advertised
          # features silently never made it into the kernel.
          for name in sm8750-netfilter.config \
                      sm8750-peripherals.config \
                      sm8750-waydroid.config \
                      sm8750-snap.config \
                      sm8750-virt.config \
                      piano-diagnostic.config \
                      piano-desktop-diag.config \
                      piano-persistent.config \
                      piano-release.config; do
            [ -f "arch/arm64/configs/$name" ] || {
              echo "::error::required config fragment missing: $name"
              exit 1
            };
            FRAGS+=("arch/arm64/configs/$name")
          done
          echo "fragments: ${FRAGS[*]}"
          scripts/kconfig/merge_config.sh -m -O . .config "${FRAGS[@]}"
          # Kali wants a real initramfs-less ext4 root, uhid for the touch daemon,
          # and bootconfig for the vendor_boot cmdline.
          cat > ../kali.config <<'EOF'
          CONFIG_UHID=m
          CONFIG_BOOT_CONFIG=y
          CONFIG_EXT4_FS=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_MODULES=y
          CONFIG_KALLSYMS=y
          CONFIG_MAGIC_SYSRQ=y
          CONFIG_PSTORE=y
          CONFIG_PSTORE_RAM=y
          # Backlight must be built in: if ktz8866.ko lives in a module and the
          # initramfs does not load it, the panel comes up with no backlight and
          # the tablet looks dead on arrival. piano-desktop-diag.config sets it
          # to m, so force y last.
          CONFIG_BACKLIGHT_KTZ8866=y
          CONFIG_BACKLIGHT_CLASS_DEVICE=y
          # Same reasoning for the p81 panel: DRM_MSM is built in, so the panel
          # cannot be a module.
          CONFIG_DRM_PANEL_NOVATEK_NT36532=y
          # The touch daemon needs uhid; the kernel side must be a module that
          # initramfs is not required to load.
          CONFIG_INPUT_EVDEV=y
          # Development build: a signature-forced kernel would refuse every
          # module we did not sign, which kills Wi-Fi, charging and audio at
          # once. Keep signing off until the stack is proven on hardware.
          CONFIG_MODULE_SIG=n
          CONFIG_MODULE_SIG_FORCE=n
          CONFIG_MODULE_SIG_ALL=n
          CONFIG_CRYPTO_LIB_SHA256=y
          CONFIG_REGMAP_I2C=y
          # Full Xiaomi/Erhai direct-charge stack: merely selecting MCA and
          # SC8541 is not enough; PPS uses SC8547A, Erhai PPS and UFCS.
          CONFIG_CHARGER_SC8547A=m
          CONFIG_CHARGER_ERHAI_PPS=m
          CONFIG_CHARGER_CPS8601=m
          CONFIG_OPLUS_UFCS_CLASS=m
          CONFIG_CHARGER_SC96231=m
          CONFIG_CHARGER_XIAOMI_MCA=m
          CONFIG_CHARGER_SC8541=m
          EOF
          scripts/kconfig/merge_config.sh -m -O . .config ../kali.config
          make LLVM=1 olddefconfig
          echo "-piano-${KVER#v}" > .scmversion

      - name: Verify the hardware stack actually made it in
        run: |
          cd linux
          fail=0
          check() {  # symbol, expected exact value, reason
            sym="$1"; expected="$2"; why="$3"
            # A disabled symbol is written as "# CONFIG_X is not set", never as
            # CONFIG_X=n, so plain "grep ^CONFIG_X=" reports it as missing.
            if grep -qx "# ${sym} is not set" .config; then
              val=n
            else
              val=$(grep -E "^${sym}=" .config | cut -d= -f2 || true)
              val=${val:-missing}
            fi
            if [ "$val" != "$expected" ]; then
              echo "::error::$sym expected =$expected, got ${val:-missing} ($why)"
              fail=1
            else
              printf '  %-40s %s\n' "$sym" "$val"
            fi
          }
          check CONFIG_DRM_MSM y "display controller built in"
          check CONFIG_DRM_PANEL_NOVATEK_NT36532 y "p81 panel built in"
          check CONFIG_BACKLIGHT_KTZ8866 y "backlight must be built in"
          check CONFIG_SM_DISPCC_8750 y "display clocks built in"
          check CONFIG_TOUCHSCREEN_NT36532E_THP y "touch built in"
          check CONFIG_HID_NANOSIC_WN8030 m "magnetic keyboard module"
          check CONFIG_CHARGER_XIAOMI_MCA m "charging module"
          check CONFIG_SND_SOC_FS19XX m "speaker amp module"
          check CONFIG_SCSI_UFS_QCOM y "UFS built in"
          check CONFIG_PHY_QCOM_QMP_UFS y "UFS PHY built in"
          check CONFIG_UHID m "touch daemon input injection module"
          check CONFIG_BOOT_CONFIG y "vendor_boot cmdline support built in"
          check CONFIG_CHARGER_SC8541 m "direct charge pump module"
          check CONFIG_CHARGER_SC8547A m "PPS/VOOC charge pump module"
          check CONFIG_CHARGER_ERHAI_PPS m "PPS engine module"
          check CONFIG_CHARGER_CPS8601 m "pen wireless charging module"
          check CONFIG_OPLUS_UFCS_CLASS m "UFCS protocol module"
          check CONFIG_CHARGER_SC96231 m "pen charger module"
          check CONFIG_TYPEC y "USB-C/PD role switching built in"
          check CONFIG_REGMAP_I2C y "I2C register-map support built in"
          check CONFIG_CRYPTO_LIB_SHA256 y "MCA protocol SHA-256 built in"
          # This build uses unsigned development modules; ensure Kconfig did not
          # re-enable forced signature verification via an imported fragment.
          # MODULE_SIG_FORCE / MODULE_SIG_ALL do not appear in .config at all
          # when MODULE_SIG is off (Kconfig drops dependent symbols), so test the
          # parent switch and both forbidden values explicitly.
          if grep -qx 'CONFIG_MODULE_SIG=y' .config; then
            for sym in CONFIG_MODULE_SIG_FORCE CONFIG_MODULE_SIG_ALL; do
              if grep -qx "${sym}=y" .config; then
                echo "::error::$sym is enabled; unsigned development modules would be refused"
                fail=1
              fi
            done
            printf '  %-40s %s\n' CONFIG_MODULE_SIG "on (neither force nor all set)"
          else
            printf '  %-40s %s\n' CONFIG_MODULE_SIG "off"
          fi
          exit $fail

      - name: Build Image, DTB and modules
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          cd linux
          M="make CC='ccache clang' LLVM=1 -j$(nproc)"
          if [ "${{ github.event.inputs.fast_only }}" = "true" ]; then
            sh -c "$M Image dtbs"
          else
            sh -c "$M Image dtbs modules"
          fi
          mkdir -p ../out/modules
          cp arch/arm64/boot/Image ../out/
          make -s LLVM=1 kernelrelease > ../out/kernel-release
          cat ../out/kernel-release
          cp .config ../out/config
          # Preserve the generic filename consumed by scripts/mk-bootimg.sh;
          # also retain the exact variant name for audit.
          DTB=arch/arm64/boot/dts/qcom/sm8750-xiaomi-piano-desktop.dtb
          if [ ! -f "$DTB" ]; then
            DTB=$(ls arch/arm64/boot/dts/qcom/sm8750-xiaomi-piano*.dtb 2>/dev/null | head -1)
          fi
          [ -n "$DTB" ] && [ -f "$DTB" ] || {
            echo "::error::no piano board DTB was built"
            ls arch/arm64/boot/dts/qcom/*.dtb | head -20
            exit 1
          }
          echo "dtb: $DTB"
          cp "$DTB" ../out/$(basename "$DTB")
          cp "$DTB" ../out/sm8750-piano.dtb

          # The bootloader applies the stock DTBO on top of whatever DTB sits in
          # vendor_boot. Hand it the raw mainline DTB and the stock board fixups
          # collide with upstream nodes. Re-run the reference project's
          # transformation, which isolates the stock overlay under a disabled
          # parent, and cross-check that no mainline hardware node moved.
          sudo apt-get install -y --no-install-recommends python3-libfdt git build-essential cmake
          if [ ! -x ../ufdt-src/ufdt_apply_overlay ]; then
            git clone -q --depth 1 https://android.googlesource.com/platform/system/libufdt ../ufdt-src &&
              make -C ../ufdt-src ufdt_apply_overlay
          fi
          test -x ../ufdt-src/ufdt_apply_overlay || {
            echo "::error::ufdt_apply_overlay was not built"; exit 1; }
          # The stock base DTB and the piano DTBO entry are device files, kept in
          # kernel/dtb-inputs/ of this repository (dump of vendor_boot_a / dtbo_a).
          python3 ../tools/prepare-boot-dtb.py \
            --mainline-dtb "../out/$(basename "$DTB")" \
            --stock-base ../kernel/dtb-inputs/stock-base.dtb \
            --stock-overlay ../kernel/dtb-inputs/piano-stock-overlay.dtb \
            --ufdt ../ufdt-src/ufdt_apply_overlay \
            --output ../out/dtb-prepared
          cp ../out/dtb-prepared/piano-boot.dtb ../out/sm8750-piano.dtb
          echo "== boot DTB prepared for the stock DTBO"
          cat ../out/dtb-prepared/manifest.json
          if [ "${{ github.event.inputs.fast_only }}" != "true" ]; then
            make LLVM=1 modules_install INSTALL_MOD_PATH=../out/modules INSTALL_MOD_STRIP=1
            find ../out/modules -type l -delete
          fi
          ccache -s | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KVER }}-piano
          path: out/
          if-no-files-found: error
          retention-days: 14
