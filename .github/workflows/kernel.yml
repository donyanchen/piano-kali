name: kernel
# Build our own piano kernel: upstream linux-stable + our board DTS + our config
# fragment. No third-party kernel tree is cloned anywhere in this pipeline.
#
# Three build jobs run in parallel on separate 4-vCPU runners because that is
# the only free size: dtb (~1 min), Image (~25 min), modules (~35 min). ccache
# keeps re-runs cheap. A final job bundles the artifact layout that
# scripts/build-kali.sh expects via PIANO_KERNEL_DIR.
on:
  workflow_dispatch:
    inputs:
      kver:
        description: linux-stable tag to build against
        default: v7.3.4
        required: true
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - '.github/workflows/kernel.yml'

permissions:
  contents: read

env:
  KVER: ${{ github.event.inputs.kver || 'v7.3.4' }}

jobs:
  dtb:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - &toolchain
        name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            lz4 xz-utils zstd cpio kmod ccache python3 clang lld llvm
          clang --version | head -1
      - &fetch
        name: Fetch upstream kernel
        run: |
          for url in https://github.com/gregkh/linux.git \
                     https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git; do
            echo "trying $url"
            git clone --depth 1 --branch "$KVER" "$url" linux && break
            rm -rf linux
          done
          test -d linux || { echo "could not fetch $KVER" >&2; exit 1; }
      - &dts
        name: Add the piano board DTS
        run: |
          cp kernel/dts/sm8750-piano.dts linux/arch/arm64/boot/dts/qcom/
          echo 'dtb-$(CONFIG_ARCH_QCOM) += sm8750-piano.dtb' \
            >> linux/arch/arm64/boot/dts/qcom/Makefile
          # Our edits make the tree dirty; pin the release string so the kernel
          # and its module directory are called 7.3.4-piano, not 7.3.4-dirty.
          echo -piano > linux/.scmversion

      - &panel
        name: Add the piano panel driver
        run: |
          # No upstream driver exists for the p81 panel: ours is built from the
          # factory DT sequences under kernel/drivers/gpu/drm/panel/.
          cp kernel/drivers/gpu/drm/panel/panel-xiaomi-p81.c \
             kernel/drivers/gpu/drm/panel/panel-xiaomi-p81/p81-35-02-0b.h \
             linux/drivers/gpu/drm/panel/
          # DRM is modular here, so the panel must be a module too: a built-in
          # driver would reference drm symbols that live in drm.ko.
          echo 'obj-m += panel-xiaomi-p81.o' >> linux/drivers/gpu/drm/panel/Makefile
      - &configure
        name: Configure
        run: |
          cd linux
          make LLVM=1 defconfig
          scripts/kconfig/merge_config.sh -m .config ../kernel/configs/piano.config
          make LLVM=1 olddefconfig
          grep -E '^CONFIG_' ../kernel/configs/piano.config | cut -d= -f1 | while read -r sym; do
            grep -q "^$sym[= ]" .config || echo "::warning::fragment symbol not in .config: $sym"
          done
      - name: Build the board DTB
        run: |
          cd linux
          make LLVM=1 qcom/sm8750-piano.dtb
          mkdir -p ../out
          cp arch/arm64/boot/dts/qcom/sm8750-piano.dtb ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: part-dtb
          path: out/sm8750-piano.dtb
          retention-days: 7

  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - *toolchain
      - *fetch
      - *dts
      - *panel
      - *configure
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-image-${{ env.KVER }}-${{ hashFiles('kernel/configs/piano.config') }}
          restore-keys: ccache-image-${{ env.KVER }}-
      - name: Build Image and modules
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          cd linux
          # modules must be built together with vmlinux: modpost resolves module
          # symbols against vmlinux's Module.symvers, which only exists after
          # vmlinux is linked.
          make LLVM=1 CC="ccache clang" -j"$(nproc)" Image modules
          mkdir -p ../out/modules
          cp arch/arm64/boot/Image ../out/
          make -s LLVM=1 kernelrelease > ../out/kernel-release
          cp .config ../out/config
          make LLVM=1 modules_install INSTALL_MOD_PATH=../out/modules INSTALL_MOD_STRIP=1
          # modules_install drops build/source symlinks that point at the whole
          # source tree; uploading them turns a 200 MB artifact into 3 GB.
          find ../out/modules -type l -delete
          ccache -s | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: part-kernel
          path: |
            out/Image
            out/kernel-release
            out/config
            out/modules
          retention-days: 7

  bundle:
    needs: [dtb, image]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - name: Assemble the kernel artifact
        run: |
          mkdir -p out
          cp parts/part-dtb/sm8750-piano.dtb out/
          cp parts/part-kernel/Image parts/part-kernel/kernel-release parts/part-kernel/config out/
          cp -a parts/part-kernel/modules out/modules
          ls -lh out/Image out/sm8750-piano.dtb
          cat out/kernel-release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.KVER }}-piano
          path: out/
          if-no-files-found: error
          retention-days: 14