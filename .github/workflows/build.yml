name: Xiaomi Pad 6S Pro Kali ARM64 KDE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kali-kde:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and ARM64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support android-sdk-libsparse-utils e2fsprogs curl ca-certificates gnupg python3
          sudo update-binfmts --enable qemu-aarch64
      - name: Build native Kali ARM64 with KDE Plasma
        env:
          KALI_PASSWORD: ${{ secrets.KALI_PASSWORD }}
        run: sudo --preserve-env=KALI_PASSWORD bash scripts/build-kali.sh
      - name: Upload images and validation results
        uses: actions/upload-artifact@v4
        with:
          name: kali-arm64-kde-xiaomi-sheng
          path: out/
          if-no-files-found: error
          retention-days: 7
