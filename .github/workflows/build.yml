name: Build Kali for Xiaomi Pad 8 Pro (piano)

on:
  workflow_dispatch:
    inputs:
      kali_password:
        description: 'Password for the kali user (empty = repository secret or "kali")'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: kalibuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: bash scripts/ci-free-space.sh

      - name: Install build tools and ARM64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap \
            android-sdk-libsparse-utils e2fsprogs zstd zip unzip curl \
            ca-certificates gnupg python3
          uname -m

      - name: Build Kali ARM64 KDE image
        env:
          KALI_PASSWORD: ${{ inputs.kali_password != '' && inputs.kali_password || secrets.KALI_PASSWORD }}
          THP_CSOT_B64: ${{ secrets.THP_CSOT_B64 }}
          THP_BOE_B64: ${{ secrets.THP_BOE_B64 }}
        run: sudo --preserve-env=KALI_PASSWORD,THP_CSOT_B64,THP_BOE_B64 bash scripts/build-kali.sh

      - name: Package release assets
        run: bash scripts/package-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kali-piano-${{ github.run_number }}
          path: out/release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/release/* --clobber
          else
            gh release create "$tag" out/release/* \
              --title "Kali for Xiaomi Pad 8 Pro $tag" \
              --notes-file out/release/RELEASE-NOTES.md
          fi
