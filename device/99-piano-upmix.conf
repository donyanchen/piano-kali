# 把 ALSA 的钢琴四喇叭上混设备注册成 PipeWire 的默认输出
context.objects = [
    { factory = adapter
      args = {
          factory.name     = api.alsa.pcm.sink
          node.name        = "piano_upmix"
          node.description = "Piano Speakers (4x upmix)"
          media.class      = "Audio/Sink"
          api.alsa.path    = "piano_stereo"
          audio.channels   = 2
          audio.position   = [ FL FR ]
          priority.session = 3000
      }
    }
]
