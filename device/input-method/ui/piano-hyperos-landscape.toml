# Piano tablet touch layout, MIT.
name = "piano-hyperos-landscape"
primary_text_size = 3
secondary_text_size = 1
min_toolbar_height = 6
spacing = 1

[[elements]]
height = 7
spacing = 1
elements = ["k_one", "k_two", "k_three", "k_four", "k_five", "k_six", "k_seven", "k_eight", "k_nine", "k_zero"]

[[elements]]
height = 7
spacing = 1
elements = ["k_q", "k_w", "k_e", "k_r", "k_t", "k_y", "k_u", "k_i", "k_o", "k_p"]

[[elements]]
height = 7
spacing = 1
elements = ["p:4", "k_a", "k_s", "k_d", "k_f", "k_g", "k_h", "k_j", "k_k", "k_l", "p:4"]

[[elements]]
height = 7
spacing = 1
elements = ["k_left_shift:12", "k_z", "k_x", "k_c", "k_v", "k_b", "k_n", "k_m", "k_backspace:13"]

[[elements]]
height = 7
spacing = 1
elements = ["k_tab:12", "k_comma:8", "k_space:41", "k_dot:8", "k_enter:16"]

[key_mappings]
k_a = "piano-hyperos:k_a"
