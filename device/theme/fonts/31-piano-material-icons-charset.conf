<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Some legacy MDI builds advertise empty ASCII glyphs (digits/lowercase).
       Remove only ASCII from their advertised coverage; keep all PUA icons. -->
  <match target="scan">
    <test name="family" compare="contains">
      <string>Material Design Icons</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset><range><int>0x20</int><int>0x7e</int></range></charset>
      </minus>
    </edit>
  </match>
</fontconfig>
